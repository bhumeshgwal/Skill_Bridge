<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization Dashboard — SkillBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none;">Skill<span>Bridge</span></a></div>
    <nav>
      <a href="index.html">Home</a>
      <span class="user-tag" id="welcome-tag"></span>
      <a href="#" onclick="handleLogout(event)" style="color:#2C5F8A;margin-left:20px;">Log Out</a>
    </nav>
  </div>

  <div class="page-wrap">

    <div class="section-header">
      <div>
        <h2>Post a New Internship</h2>
        <p>List the skills you need — we'll rank suitable students for you automatically.</p>
      </div>
    </div>

    <form id="job-form" class="form-card" onsubmit="handlePostJob(event)" style="margin-bottom:40px;">
      <label for="j-title">Role Title</label>
      <input type="text" id="j-title" placeholder="e.g. Backend Intern" required>

      <label for="j-skills">Required Skills</label>
      <input type="text" id="j-skills" placeholder="e.g. Python, SQL, Data Structures" required>
      <div class="hint">Separate each skill with a comma.</div>

      <label for="j-stipend">Stipend</label>
      <input type="text" id="j-stipend" placeholder="e.g. ₹8,000/month" required>

      <label for="j-duration">Duration</label>
      <input type="text" id="j-duration" placeholder="e.g. 3 months" required>

      <button type="submit" class="btn btn-primary" style="margin-top:22px;">Post Internship</button>
    </form>

    <div class="section-header">
      <div>
        <h2>Your Postings</h2>
        <p>Click a listing to see students ranked by fit.</p>
      </div>
    </div>

    <div id="job-list"></div>

    <div id="applicant-panel"></div>

  </div>

  <footer>
    Built for the College Ideathon — SkillBridge Prototype © 2026
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    initData();

    // Check if user is logged in
    const currentOrg = getCurrentUser();
    if (!currentOrg || currentOrg.role !== "industry") {
      window.location.href = "login.html";
    }

    document.getElementById("welcome-tag").textContent = currentOrg.orgName || currentOrg.name;

    function handlePostJob(e) {
      e.preventDefault();
      const job = {
        id: generateId("j"),
        title: document.getElementById("j-title").value.trim(),
        org: currentOrg.orgName || currentOrg.name,
        orgId: currentOrg.id,
        skills: parseSkillsInput(document.getElementById("j-skills").value),
        stipend: document.getElementById("j-stipend").value.trim(),
        duration: document.getElementById("j-duration").value.trim()
      };
      addJob(job);
      e.target.reset();
      renderJobs();
    }

    function renderJobs() {
      const allJobs = getJobs();
      const myJobs = allJobs.filter(j => j.orgId === currentOrg.id);
      const container = document.getElementById("job-list");

      if (myJobs.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No postings yet. Add one above.</p></div>`;
        return;
      }

      container.innerHTML = myJobs.map(job => `
        <div class="card">
          <div class="card-row">
            <div>
              <h3>${job.title}</h3>
              <div class="org">${job.org}</div>
            </div>
            <button class="btn btn-outline btn-small" onclick="showApplicants('${job.id}')">View Applications</button>
          </div>
          <div class="tag-list">
            ${job.skills.map(s => `<span class="tag">${s}</span>`).join("")}
          </div>
          <div class="meta-row">
            <strong>Stipend:</strong> ${job.stipend} &nbsp;•&nbsp; <strong>Duration:</strong> ${job.duration}
          </div>
        </div>
      `).join("");
    }

    function showApplicants(jobId) {
      const job = getJobs().find(j => j.id === jobId);
      const ranked = getRankedStudentsForJob(job);
      const applications = getApplications();
      const panel = document.getElementById("applicant-panel");

      panel.innerHTML = `
        <div class="section-header" style="margin-top:30px;">
          <div>
            <h2>Best-Fit Students for "${job.title}"</h2>
            <p>Ranked highest match first. Click Accept/Reject to update application status.</p>
          </div>
        </div>
        ${ranked.map(student => {
          const studentApp = applications.find(a => a.jobId === jobId && a.studentId === student.id);
          const appId = studentApp?.id;
          const appStatus = studentApp?.status || "Not Applied";
          
          return `
            <div class="card">
              <div class="card-row">
                <div>
                  <h3>${student.name}</h3>
                  <div class="org">${student.college}</div>
                </div>
                <span class="match-badge ${getMatchClass(student.score)}">${student.score}% match</span>
              </div>
              <div class="tag-list">
                ${student.skills.map(s => `<span class="tag">${s}</span>`).join("")}
              </div>
              <div style="margin-top:14px;">
                ${
                  !studentApp 
                    ? `<span class="status-pill">Not Applied</span>`
                    : `
                      <span class="status-pill" style="background:#F1F0EA;color:#4A4A44;margin-right:8px;">${appStatus}</span>
                      ${appStatus === "Applied" ? `
                        <button class="btn btn-primary btn-small" onclick="updateAppStatus('${appId}', 'Accepted')">Accept</button>
                        <button class="btn btn-outline btn-small" style="margin-left:6px;" onclick="updateAppStatus('${appId}', 'Rejected')">Reject</button>
                      ` : ''}
                    `
                }
              </div>
            </div>
          `;
        }).join("")}
      `;

      panel.scrollIntoView({ behavior: "smooth" });
    }

    function updateAppStatus(appId, newStatus) {
      updateApplicationStatus(appId, newStatus);
      // Refresh the view
      const jobId = new URLSearchParams(window.location.search).get("job");
      renderJobs();
      const jobs = getJobs();
      if (jobs.length > 0) showApplicants(jobs[0].id);
    }

    function handleLogout(e) {
      e.preventDefault();
      logoutUser();
      window.location.href = "login.html";
    }

    renderJobs();
  </script>
</body>
</html>
