<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization Dashboard — SkillBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none;">Skill<span>Bridge</span></a></div>
    <nav>
      <a href="index.html">Home</a>
      <span class="user-tag" id="welcome-tag"></span>
    </nav>
  </div>

  <div class="page-wrap">

    <div class="section-header">
      <div>
        <h2>Post a New Internship</h2>
        <p>List the skills you need — we'll rank suitable students for you automatically.</p>
      </div>
    </div>

    <form id="job-form" class="form-card" onsubmit="handlePostJob(event)" style="margin-bottom:40px;">
      <label for="j-title">Role Title</label>
      <input type="text" id="j-title" placeholder="e.g. Backend Intern" required>

      <label for="j-skills">Required Skills</label>
      <input type="text" id="j-skills" placeholder="e.g. Python, SQL, Data Structures" required>
      <div class="hint">Separate each skill with a comma.</div>

      <label for="j-stipend">Stipend</label>
      <input type="text" id="j-stipend" placeholder="e.g. ₹8,000/month" required>

      <label for="j-duration">Duration</label>
      <input type="text" id="j-duration" placeholder="e.g. 3 months" required>

      <button type="submit" class="btn btn-primary" style="margin-top:22px;">Post Internship</button>
    </form>

    <div class="section-header">
      <div>
        <h2>Your Postings</h2>
        <p>Click a listing to see students ranked by fit.</p>
      </div>
    </div>

    <div id="job-list"></div>

    <div id="applicant-panel"></div>

  </div>

  <footer>
    Built for the College Ideathon — SkillBridge Prototype © 2026
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    const orgName = localStorage.getItem("sb_current_org_name") || "Your Organization";
    document.getElementById("welcome-tag").textContent = orgName;

    function handlePostJob(e) {
      e.preventDefault();
      const job = {
        id: generateId("j"),
        title: document.getElementById("j-title").value.trim(),
        org: orgName,
        skills: parseSkillsInput(document.getElementById("j-skills").value),
        stipend: document.getElementById("j-stipend").value.trim(),
        duration: document.getElementById("j-duration").value.trim()
      };
      addJob(job);
      e.target.reset();
      renderJobs();
    }

    function renderJobs() {
      const jobs = getJobs();
      const container = document.getElementById("job-list");

      if (jobs.length === 0) {
        container.innerHTML = `<div class="empty-state"><p>No postings yet. Add one above.</p></div>`;
        return;
      }

      container.innerHTML = jobs.map(job => `
        <div class="card">
          <div class="card-row">
            <div>
              <h3>${job.title}</h3>
              <div class="org">${job.org}</div>
            </div>
            <button class="btn btn-outline btn-small" onclick="showApplicants('${job.id}')">View Matches</button>
          </div>
          <div class="tag-list">
            ${job.skills.map(s => `<span class="tag">${s}</span>`).join("")}
          </div>
          <div class="meta-row">
            <strong>Stipend:</strong> ${job.stipend} &nbsp;•&nbsp; <strong>Duration:</strong> ${job.duration}
          </div>
        </div>
      `).join("");
    }

    function showApplicants(jobId) {
      const job = getJobs().find(j => j.id === jobId);
      const ranked = getRankedStudentsForJob(job);
      const panel = document.getElementById("applicant-panel");

      panel.innerHTML = `
        <div class="section-header" style="margin-top:30px;">
          <div>
            <h2>Best-Fit Students for "${job.title}"</h2>
            <p>Ranked highest match first.</p>
          </div>
        </div>
        ${ranked.map(student => `
          <div class="card">
            <div class="card-row">
              <div>
                <h3>${student.name}</h3>
                <div class="org">${student.college}</div>
              </div>
              <span class="match-badge ${getMatchClass(student.score)}">${student.score}% match</span>
            </div>
            <div class="tag-list">
              ${student.skills.map(s => `<span class="tag">${s}</span>`).join("")}
            </div>
          </div>
        `).join("")}
      `;

      panel.scrollIntoView({ behavior: "smooth" });
    }

    renderJobs();
  </script>
</body>
</html>
