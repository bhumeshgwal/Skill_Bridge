<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — SkillBridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="navbar">
    <div class="logo"><a href="index.html" style="color:inherit;text-decoration:none;">Skill<span>Bridge</span></a></div>
    <nav>
      <a href="index.html">Home</a>
    </nav>
  </div>

  <div class="narrow-wrap">
    <div class="form-card">
      <h2>Welcome to SkillBridge</h2>
      <p class="subtitle">Choose your role and create a quick profile to see it in action.</p>

      <div class="role-toggle">
        <button type="button" id="btn-role-student" class="active" onclick="setRole('student')">I'm a Student</button>
        <button type="button" id="btn-role-industry" onclick="setRole('industry')">I'm an Organization</button>
      </div>

      <!-- Student form -->
      <form id="student-form" onsubmit="handleStudentSignup(event)">
        <label for="s-name">Full Name</label>
        <input type="text" id="s-name" placeholder="e.g. Bhumesh Rajput" required>

        <label for="s-college">College</label>
        <input type="text" id="s-college" placeholder="e.g. DHSGSU Sagar" required>

        <label for="s-skills">Your Skills</label>
        <input type="text" id="s-skills" placeholder="e.g. Python, SQL, React" required>
        <div class="hint">Separate each skill with a comma.</div>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:22px;">Continue as Student</button>
      </form>

      <!-- Industry form -->
      <form id="industry-form" onsubmit="handleIndustrySignup(event)" style="display:none;">
        <label for="i-org">Organization Name</label>
        <input type="text" id="i-org" placeholder="e.g. TechNova Pvt Ltd" required>

        <label for="i-contact">Contact Person</label>
        <input type="text" id="i-contact" placeholder="e.g. HR Manager Name" required>

        <button type="submit" class="btn btn-primary btn-full" style="margin-top:22px;">Continue as Organization</button>
      </form>
    </div>
  </div>

  <footer>
    Built for the College Ideathon — SkillBridge Prototype © 2026
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // Pre-select role if arriving from a specific CTA button (?role=student / ?role=industry)
    const params = new URLSearchParams(window.location.search);
    const initialRole = params.get("role");
    if (initialRole === "industry") setRole("industry");

    function setRole(role) {
      const isStudent = role === "student";
      document.getElementById("btn-role-student").classList.toggle("active", isStudent);
      document.getElementById("btn-role-industry").classList.toggle("active", !isStudent);
      document.getElementById("student-form").style.display = isStudent ? "block" : "none";
      document.getElementById("industry-form").style.display = isStudent ? "none" : "block";
    }

    function handleStudentSignup(e) {
      e.preventDefault();
      const name = document.getElementById("s-name").value.trim();
      const college = document.getElementById("s-college").value.trim();
      const skills = parseSkillsInput(document.getElementById("s-skills").value);

      const student = {
        id: generateId("s"),
        name,
        college,
        skills
      };

      addStudent(student);
      // Remember who is "logged in" for this demo session
      localStorage.setItem("sb_current_student_id", student.id);
      window.location.href = "student.html";
    }

    function handleIndustrySignup(e) {
      e.preventDefault();
      const org = document.getElementById("i-org").value.trim();
      const contact = document.getElementById("i-contact").value.trim();

      // Industry accounts aren't stored in a list (only their job posts matter for the demo),
      // so we just remember the org name for this session.
      localStorage.setItem("sb_current_org_name", org);
      localStorage.setItem("sb_current_org_contact", contact);
      window.location.href = "industry.html";
    }
  </script>
</body>
</html>
